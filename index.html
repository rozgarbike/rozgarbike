<!-- Google Urdu Font link (Head section mein lagane ke liye) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

<style>
  .urdu-poster-card {
    background: #f8fafc;
    border: 2px solid #0f3932;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
    direction: rtl;
    text-align: center;
    font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .poster-header {
    background: linear-gradient(135deg, #0f3932 0%, #1e5e52 100%);
    color: #ffffff;
    padding: 18px 12px;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .poster-header h2 {
    margin: 0 0 6px 0;
    font-size: 24px;
    font-weight: 700;
    color: #00ffaa;
  }

  .poster-header p {
    margin: 0;
    font-size: 15px;
    opacity: 0.95;
    line-height: 1.8;
  }

  .poster-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .poster-box {
    flex: 1 1 45%;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }

  .box-label {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 4px;
  }

  .box-value {
    font-size: 20px;
    font-weight: 800;
    color: #0f3932;
    direction: ltr;
  }

  .profit-highlight {
    background: #dcfce7;
    border: 1px dashed #16a34a;
  }

  .profit-highlight .box-value {
    color: #15803d;
  }

  .poster-features {
    display: flex;
    justify-content: space-around;
    background: #0f3932;
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
  }

  .poster-footer-btn {
    background: #25d366;
    color: #ffffff;
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    display: block;
    box-shadow: 0 4px 10px rgba(37,211,102,0.3);
  }
</style>

<!-- MAIN POSTER BANNER -->
<div class="urdu-poster-card">
  
  <!-- Header Title -->
  <div class="poster-header">
    <h2>تجارتی بائیک فلیٹ پارٹنرشپ</h2>
    <p>90 دن کے فعال بزنس سائیکل کا حصہ بنیں</p>
  </div>

  <!-- Investment & Profit Details -->
  <div class="poster-grid">
    <div class="poster-box">
      <div class="box-label">سرمایہ کاری (Flexi Unit)</div>
      <div class="box-value">Rs 1,000 - 5,000</div>
    </div>
    
    <div class="poster-box profit-highlight">
      <div class="box-label">روزانہ کا منافع (Returns)</div>
      <div class="box-value">Rs 50 - 350*</div>
      <div style="font-size:10px; color:#166534; margin-top:2px;">(90 دن کی مسلسل پرفارمنس)</div>
    </div>
  </div>

  <!-- Features List -->
  <div class="poster-features">
    <div>📊 شفاف ڈیش بورڈ</div>
    <div>🗓 90 دن کا سائیکل</div>
    <div>👥 بڑھتی برادری</div>
  </div>

  <!-- CTA Button -->
  <a href="#authBox" class="poster-footer-btn">
    📞 آج ہی رابطہ کریں اور اپنے کاروبار کا آغاز کریں!
  </a>

</div>
