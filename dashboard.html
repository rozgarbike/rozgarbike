<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Dashboard — MadadNow</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="brand"><span class="brand-badge">🚲</span> MadadNow</div>
      <button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,0.4);padding:6px 12px;font-size:12px;" onclick="logout()">Log out</button>
    </div>
    <div class="nav">
      <a href="index.html">Bikes</a>
      <a href="dashboard.html" class="active">My Dashboard</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
    </div>
  </div>

  <div class="wrap">
    <div class="card" style="background:var(--petrol);color:#fff;margin-bottom:16px;border:none;">
      <div class="muted" style="color:#CFE3DD;">Wallet balance</div>
      <div id="walletBalance" class="mono" style="font-size:30px;font-weight:600;margin-top:4px;">Rs 0</div>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="requestWithdraw()">Withdraw</button>
    </div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">MY INVESTMENTS</div>
    <div id="investmentsList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;"></div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">REFERRALS</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;">
        <span class="muted">People you referred</span>
        <span id="refCount" class="mono" style="font-weight:600;">0</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px;">
        <span class="muted">Total referral + milestone bonus</span>
        <span id="refBonus" class="mono" style="font-weight:600;color:var(--success);">Rs 0</span>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);">
        <div style="display:flex;justify-content:space-between;">
          <span style="font-size:12px;font-weight:700;color:var(--mustard-deep);">10-referral bonus</span>
          <span id="milestoneProgressText" class="mono muted" style="font-size:12px;">0/10</span>
        </div>
        <div class="progress-track" style="margin-top:6px;"><div id="milestoneBar" class="progress-fill" style="width:0%;"></div></div>
      </div>
      <button class="btn btn-outline" style="width:100%;margin-top:12px;" onclick="copyRef()">
        <span id="refLinkText">Copy your referral link</span>
      </button>
    </div>
  </div>

  <!-- contribute modal -->
  <div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(18,61,61,0.5);align-items:flex-end;justify-content:center;z-index:20;">
    <div class="card" style="border-radius:18px 18px 0 0;width:100%;max-width:480px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div id="modalTitle" class="disp" style="font-size:18px;">FUND BIKE</div>
        <button onclick="closeModal()" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="muted" style="margin-bottom:6px;">Choose your amount</div>
      <div class="tier-row" id="tierRow"></div>
      <div class="muted" style="margin-top:12px;margin-bottom:6px;">Or enter a custom amount (min Rs 1,000)</div>
      <input id="customAmount" type="number" placeholder="1000" />
      <div class="muted" style="margin-top:8px;line-height:1.5;">This is your own contribution — tracked only under your account.</div>
      <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="confirmContribute()">Confirm contribution</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let profile = null;
    let selectedAmount = null;
    let activeCampaignId = null;

    async function init() {
      profile = await requireSession(false);
      if (!profile) return;
      if (profile.role === "admin") document.getElementById("adminLink").style.display = "inline-block";

      document.getElementById("refLinkText").textContent = `madadnow.app?ref=${profile.referral_code}`;

      await loadWallet();
      await loadInvestments();
      await loadReferrals();

      const params = new URLSearchParams(window.location.search);
      const contributeId = params.get("contribute");
      if (contributeId) openModalFor(contributeId);
    }

    async function loadWallet() {
      const { data: txns } = await supabaseClient.from("wallet_transactions").select("amount").eq("investor_id", profile.id);
      const total = (txns || []).reduce((s, t) => s + Number(t.amount), 0);
      document.getElementById("walletBalance").textContent = pkr(total);
    }

    async function loadInvestments() {
      const { data: myInv } = await supabaseClient
        .from("investments").select("*, campaigns(*)").eq("investor_id", profile.id);
      const listEl = document.getElementById("investmentsList");
      if (!myInv || !myInv.length) {
        listEl.innerHTML = `<p class="muted" style="text-align:center;padding:20px;">No investments yet — fund a bike from the homepage.</p>`;
        return;
      }
      listEl.innerHTML = "";
      for (const inv of myInv) {
        const cap = inv.campaigns.target + inv.campaigns.margin;
        const totalFunded = await totalFundedFor(inv.campaign_id);
        const myShareOfCap = cap * (inv.amount / totalFunded);
        const pct = (inv.received / myShareOfCap) * 100;
        const div = document.createElement("div");
        div.className = "card";
        div.style.cssText = "display:flex;justify-content:space-between;align-items:center;";
        div.innerHTML = `
          <div>
            <div style="font-weight:700;font-size:14px;">${inv.campaigns.name}</div>
            <div class="muted" style="margin-top:2px;">You put in ${pkr(inv.amount)}</div>
            <div class="mono" style="color:var(--success);margin-top:4px;font-size:12.5px;">+${pkr(inv.received)} received so far</div>
          </div>
          <div class="gauge-wrap">${gaugeSVG(pct, 78, "#4C7A57")}</div>
        `;
        listEl.appendChild(div);
      }
    }

    async function totalFundedFor(campaignId) {
      const { data } = await supabaseClient.from("investments").select("amount").eq("campaign_id", campaignId);
      return (data || []).reduce((s, i) => s + Number(i.amount), 0);
    }

    async function loadReferrals() {
      const { data: refs } = await supabaseClient.from("referrals").select("*").eq("referrer_id", profile.id);
      const count = (refs || []).filter(r => r.bonus_paid).length;
      const { data: bonusTxns } = await supabaseClient.from("wallet_transactions")
        .select("amount").eq("investor_id", profile.id).in("type", ["referral_bonus", "milestone_bonus"]);
      const bonusTotal = (bonusTxns || []).reduce((s, t) => s + Number(t.amount), 0);

      document.getElementById("refCount").textContent = count;
      document.getElementById("refBonus").textContent = pkr(bonusTotal);
      const within = count % 10;
      document.getElementById("milestoneProgressText").textContent = `${within}/10`;
      document.getElementById("milestoneBar").style.width = (within / 10) * 100 + "%";
    }

    async function openModalFor(campaignId) {
      const { data: c } = await supabaseClient.from("campaigns").select("*").eq("id", campaignId).single();
      if (!c) return;
      activeCampaignId = campaignId;
      selectedAmount = null;
      document.getElementById("modalTitle").textContent = "FUND " + c.name.toUpperCase();
      const tierRow = document.getElementById("tierRow");
      tierRow.innerHTML = "";
      [1000, 2000, 4000].forEach(t => {
        const b = document.createElement("button");
        b.className = "tier-btn"; b.textContent = "Rs " + t.toLocaleString();
        b.onclick = () => selectTier(t, b);
        tierRow.appendChild(b);
      });
      document.getElementById("customAmount").value = "";
      document.getElementById("modalOverlay").style.display = "flex";
    }

    function selectTier(amount, btn) {
      selectedAmount = amount;
      document.getElementById("customAmount").value = amount;
      document.querySelectorAll(".tier-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
    }

    function closeModal() { document.getElementById("modalOverlay").style.display = "none"; }

    async function confirmContribute() {
      const amt = Number(document.getElementById("customAmount").value);
      if (!amt || amt < 1000) return toast("Minimum contribution is Rs 1,000");
      const { error } = await supabaseClient.rpc("record_investment_and_bonuses", {
        p_campaign_id: activeCampaignId, p_amount: amt,
      });
      if (error) return toast(error.message);
      toast(pkr(amt) + " contributed");
      closeModal();
      await loadInvestments();
      await loadWallet();
    }

    async function requestWithdraw() {
      toast("Withdrawal request sent to admin");
    }

    function copyRef() {
      navigator.clipboard.writeText(`https://madadnow.app?ref=${profile.referral_code}`);
      toast("Referral link copied");
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    init();
  </script>
</body>
</html>
