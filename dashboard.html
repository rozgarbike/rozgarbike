<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RozgarBike — Dashboard</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #f4efe6; color: #1e293b; margin: 0; padding: 0; }
  
  /* Top Navigation */
  .navbar { background: #0b3c36; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .logo-area { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 20px; }
  .logo-box { background: #e29d38; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .nav-btns { display: flex; gap: 8px; align-items: center; }
  .btn-nav { background: #1a564d; color: #fff; border: none; padding: 6px 14px; border-radius: 20px; text-decoration: none; font-size: 13px; cursor: pointer; }
  .btn-logout { background: transparent; border: 1px solid #718096; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }

  .container { max-width: 500px; margin: 0 auto; padding: 15px; }

  /* User Greeting */
  .greeting { font-size: 22px; font-weight: bold; color: #0b3c36; margin: 10px 0 15px 0; }

  /* Section Card UI */
  .section-label { font-size: 13px; font-weight: 800; text-transform: uppercase; color: #2d3748; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .card { background: #ffffff; border-radius: 10px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

  /* Buttons & Inputs */
  .btn-main { width: 100%; background: #e29d38; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; }
  .btn-dark { width: 100%; background: #0b3c36; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
  .btn-copy { background: #e29d38; color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  
  .input-box { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; font-size: 14px; outline: none; }

  /* Deposit Modal / Popup */
  .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box; }
  .modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
  .close-modal { position: absolute; top: 12px; right: 15px; font-size: 20px; font-weight: bold; cursor: pointer; color: #64748b; }
  .acc-info { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo-area">
      <div class="logo-box">🚲</div>
      <span>RozgarBike</span>
    </div>
    <div class="nav-btns">
      <a id="adminLink" href="admin.html" class="btn-nav" style="display:none; background:#f59e0b; color:#000;">Admin</a>
      <button onclick="handleLogout()" class="btn-logout">Log out</button>
    </div>
  </div>

  <div class="container">
    
    <!-- WELCOME USER -->
    <div class="greeting">Welcome, <span id="userName">User</span></div>

    <!-- 1. REFERRAL PROGRAM -->
    <div class="section-label">🎁 REFERRAL PROGRAM</div>
    <div class="card">
      <div style="font-size: 14px; margin-bottom: 8px;">Name: <strong id="displayName">Loading...</strong></div>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input id="refInput" readonly class="input-box" style="margin: 0; background: #f8fafc;" value="https://rozgarbike.github.io/index.html" />
        <button class="btn-copy" onclick="copyRefLink()">Copy</button>
      </div>
      <div style="font-size: 14px; font-weight: bold; color: #334155;">👥 My Referrals:</div>
      <div id="refCountText" style="font-size: 13px; color: #64748b; margin-top: 2px;">No active referrals yet.</div>
    </div>

    <!-- 2. WITHDRAWAL SECTION -->
    <div class="section-label">💰 WITHDRAWAL</div>
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="color: #64748b; font-size: 14px;">Approved Balance:</span>
        <span style="font-size: 20px; font-weight: bold; color: #000;">Rs <span id="approvedBalance">0</span></span>
      </div>
      
      <div id="withdrawForm" style="display: none; margin-top: 15px; border-top: 1px dashed #cbd5e1; padding-top: 12px;">
        <select id="wMethod" class="input-box">
          <option value="JazzCash">JazzCash</option>
          <option value="EasyPaisa">EasyPaisa</option>
          <option value="Bank">Bank Account</option>
        </select>
        <input id="wTitle" class="input-box" placeholder="Account Title (نام)" />
        <input id="wNumber" class="input-box" placeholder="Account Number (نمبر)" />
        <input id="wAmount" type="number" class="input-box" placeholder="رقم (100 - 10,000 PKR)" />
        <button class="btn-dark" onclick="submitWithdrawal()">Submit Request</button>
      </div>

      <button id="toggleWithdrawBtn" class="btn-dark" onclick="toggleWithdraw()">Request Withdrawal</button>
    </div>

    <!-- 3. DEPOSIT / FUND BIKE -->
    <div class="section-label">📥 DEPOSIT / FUND BIKE</div>
    <div class="card">
      <button class="btn-main" onclick="openDepositModal()">Make a Deposit / Add Slip</button>
    </div>

    <!-- 4. MY INVESTMENTS -->
    <div class="section-label">📋 MY INVESTMENTS</div>
    <div class="card">
      <div id="investmentsList">
        <div style="font-size:13px; color:#64748b;">No active investment found.</div>
      </div>
    </div>

  </div>

  <!-- DEPOSIT MODAL / POPUP WITH CHOOSE FILE & TRANSACTION ID -->
  <div id="depositModal" class="modal-overlay">
    <div class="modal-box">
      <span class="close-modal" onclick="closeDepositModal()">&times;</span>
      <h3 style="margin-top:0; color:#0b3c36; text-align:center;">Make Deposit & Add Slip</h3>
      
      <div style="font-size:12px; font-weight:bold; color:#475569; margin-bottom:5px;">آفیشل اکاؤنٹ کی تفصیلات:</div>
      <div id="modalAccounts" class="acc-info">اکاؤنٹس لوڈ ہو رہے ہیں...</div>

      <label style="font-size:12px; font-weight:bold; color:#475569;">ڈپازٹ رقم (PKR):</label>
      <input id="depAmount" type="number" class="input-box" placeholder="Rs 1,000 کم از کم" />

      <label style="font-size:12px; font-weight:bold; color:#475569;">Transaction ID (Trx ID):</label>
      <input id="depTrxId" type="text" class="input-box" placeholder="مثلاً: 1234567890" />

      <label style="font-size:12px; font-weight:bold; color:#475569;">پیمنٹ سلپ اپلوڈ کریں (Choose File):</label>
      <input id="depFile" type="file" accept="image/*" class="input-box" style="padding:6px; background:#f8fafc;" />

      <button id="submitDepBtn" class="btn-main" onclick="submitDeposit()">Submit Slip Request</button>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script>
    function getSupabase() { return window.supabaseClient || window.supabase; }

    async function handleLogout() {
      const db = getSupabase();
      if(db) await db.auth.signOut();
      window.location.href = "index.html";
    }

    function toggleWithdraw() {
      const form = document.getElementById("withdrawForm");
      const btn = document.getElementById("toggleWithdrawBtn");
      if (form.style.display === "none") {
        form.style.display = "block";
        btn.style.display = "none";
      }
    }

    function openDepositModal() {
      document.getElementById("depositModal").style.display = "flex";
    }

    function closeDepositModal() {
      document.getElementById("depositModal").style.display = "none";
    }

    function copyRefLink() {
      const input = document.getElementById("refInput");
      input.select();
      document.execCommand("copy");
      alert("Referral link copied!");
    }

    async function initDashboard() {
      const db = getSupabase();
      if (!db) return;

      const { data: { user } } = await db.auth.getUser();
      if (!user) { window.location.href = "index.html"; return; }

      // Profile Fetch
      const { data: profile } = await db.from("profiles").select("*").eq("id", user.id).single();
      const name = profile?.full_name || user.email.split("@")[0];
      document.getElementById("userName").innerText = name;
      document.getElementById("displayName").innerText = name;
      
      const refUrl = window.location.origin + "/index.html?ref=" + user.id;
      document.getElementById("refInput").value = refUrl;

      if (profile?.role === "admin" || user.email?.includes("admin")) {
        document.getElementById("adminLink").style.display = "inline-block";
      }

      // Approved Balance Calculation
      const { data: approvedDeps } = await db.from("investments").select("amount, created_at, status, trx_id").eq("investor_id", user.id);
      let totalInv = 0;
      const listContainer = document.getElementById("investmentsList");
      
      if (approvedDeps && approvedDeps.length > 0) {
        listContainer.innerHTML = "";
        approvedDeps.forEach(inv => {
          if (inv.status === "approved") totalInv += Number(inv.amount);
          listContainer.innerHTML += `
            <div style="margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px;">
              <strong style="color:#0b3c36;">Rozgar Bike Fund</strong> - Rs ${Number(inv.amount).toLocaleString()}
              ${inv.trx_id ? `<br/><span style="font-size:11px; color:#475569;">Trx ID: ${inv.trx_id}</span>` : ''}
              <br/><span style="font-size:12px; color:${inv.status === 'approved' ? '#16a34a' : '#d97706'}; font-weight:bold;">Status: ${inv.status}</span>
            </div>
          `;
        });
      }

      // Wallet Balance / Profits
      const { data: txs } = await db.from("wallet_transactions").select("amount").eq("investor_id", user.id).eq("status", "approved");
      let profit = txs ? txs.reduce((sum, item) => sum + Number(item.amount), 0) : 0;
      
      const { data: withs } = await db.from("withdrawal_requests").select("amount").eq("investor_id", user.id).eq("status", "approved");
      let withdrawn = withs ? withs.reduce((sum, item) => sum + Number(item.amount), 0) : 0;

      let netBalance = profit - withdrawn;
      document.getElementById("approvedBalance").innerText = Math.max(0, netBalance).toLocaleString();

      // Referrals count
      const { data: refs } = await db.from("profiles").select("id").eq("referred_by", user.id);
      if (refs && refs.length > 0) {
        document.getElementById("refCountText").innerText = `${refs.length} user(s) registered using your link.`;
      }

      // Load Accounts for Modal
      loadAccountsForModal(db);
    }

    async function loadAccountsForModal(db) {
      const box = document.getElementById("modalAccounts");
      const { data: methods } = await db.from("payment_methods").select("*");
      if (!methods || methods.length === 0) {
        box.innerHTML = "کوئی اکاؤنٹ دستیاب نہیں ہے۔";
        return;
      }
      box.innerHTML = methods.map(m => `<div><strong>${m.label}:</strong> ${m.account_title} (${m.account_number})</div>`).join("");
    }

    async function submitDeposit() {
      const db = getSupabase();
      const { data: { user } } = await db.auth.getUser();
      const amount = Number(document.getElementById("depAmount").value);
      const trxId = document.getElementById("depTrxId").value.trim();
      const fileInput = document.getElementById("depFile");
      const submitBtn = document.getElementById("submitDepBtn");

      if (amount < 1000) return alert("کم از کم انویسٹمنٹ 1,000 روپے ہے۔");
      if (!trxId) return alert("براہ کرم Transaction ID (Trx ID) درج کریں۔");
      if (!fileInput.files || fileInput.files.length === 0) return alert("براہ کرم سلپ کی تصویر سلیکٹ کریں (Choose File)۔");

      submitBtn.disabled = true;
      submitBtn.innerText = "Uploading Slip...";

      try {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${user.id}_${Date.now()}.${fileExt}`;
        const filePath = `slips/${fileName}`;

        // 1. Upload File to Supabase Bucket 'slips'
        const { data: uploadData, error: uploadError } = await db.storage
          .from("slips")
          .upload(filePath, file);

        let publicUrl = "";
        if (uploadError) {
          // Fallback if Storage Bucket setup issue
          console.warn("Storage upload failed, fallback:", uploadError.message);
          publicUrl = "Uploaded via File (" + file.name + ")";
        } else {
          const { data: urlData } = db.storage.from("slips").getPublicUrl(filePath);
          publicUrl = urlData.publicUrl;
        }

        // 2. Insert into investments table
        const { error: dbError } = await db.from("investments").insert([{
          investor_id: user.id,
          amount: amount,
          trx_id: trxId,
          slip_url: publicUrl,
          status: "pending"
        }]);

        if (dbError) throw dbError;

        alert("سلپ اور Transaction ID کامیابی سے محفوظ ہو گئے ہیں!");
        closeDepositModal();
        location.reload();

      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Slip Request";
      }
    }

    window.addEventListener("DOMContentLoaded", initDashboard);
  </script>
</body>
</html>
