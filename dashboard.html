<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Dashboard — RozgarBike</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="brand"><span class="brand-badge">🚲</span> RozgarBike</div>
      <button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,0.4);padding:6px 12px;font-size:12px;cursor:pointer;" onclick="handleLogout()">Log out</button>
    </div>
    <div class="nav">
      <a href="index.html">Bikes</a>
      <a href="dashboard.html" class="active">My Dashboard</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
    </div>
  </div>

  <div class="wrap">
    <div id="welcomeName" class="disp" style="font-size:20px;color:var(--petrol);margin-bottom:16px;">Loading...</div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">WITHDRAWAL</div>
    <div class="card" style="margin-bottom:24px;">
      <div class="muted">Available for Withdrawal</div>
      <div id="walletBalance" class="mono" style="font-size:28px;font-weight:700;margin:6px 0 14px;color:var(--ink);">Rs 0</div>
      <button class="btn btn-dark" style="width:100%;" onclick="alert('Withdrawal feature is active.')">Request Withdrawal</button>
    </div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">🎁 REFERRAL PROGRAM</div>
    <div class="card" style="margin-bottom:24px;">
      <div class="muted" style="margin-bottom:10px;">Your name: <strong style="color:var(--ink);" id="myNameInline"></strong></div>

      <div id="progressBox" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;">
          <span class="muted">Milestone Progress</span>
          <span id="refCount" class="mono">0 / 10</span>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-fill" style="width:0%;"></div></div>
      </div>

      <div class="muted" style="margin-bottom:6px;font-weight:700;font-size:12px;">Aap ka referral link:</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <input id="refLinkInput" readonly style="flex:1;font-size:12px;" />
        <button class="btn btn-primary" style="padding:0 16px;white-space:nowrap;" onclick="navigator.clipboard.writeText(document.getElementById('refLinkInput').value); alert('Copied!');">Copy</button>
      </div>

      <div style="font-weight:700;font-size:13px;margin-bottom:10px;border-top:1px solid var(--line);padding-top:12px;">
        👥 Aap ke link se join hone wale log:
      </div>
      <div id="referredUsersList" style="display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;">
        <p class="muted" style="font-size:12px;">Loading...</p>
      </div>
    </div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">FUND A BIKE</div>
    <div class="card" style="margin-bottom:24px;">
      <div class="muted" style="margin-bottom:6px;">Select a bike campaign</div>
      <select id="campaignSelect" style="margin-bottom:14px;"></select>
      <button class="btn btn-primary" style="width:100%;">Continue</button>
    </div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">MY INVESTMENTS</div>
    <div id="investmentsList" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>

  <script src="assets/config.js"></script>
  <script>
    function pkr(val) {
      return "Rs " + Number(val || 0).toLocaleString("en-PK");
    }

    async function handleLogout() {
      try {
        if (window.supabaseClient) await supabaseClient.auth.signOut();
      } catch (e) {}
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = "index.html";
    }

    async function loadDashboardDirectly() {
      try {
        if (!window.supabaseClient) return;

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = "index.html";
          return;
        }

        const userId = session.user.id;

        // Profile
        const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
        const fullName = profile?.full_name || session.user.user_metadata?.full_name || "Investor";
        
        document.getElementById("welcomeName").textContent = "Welcome, " + fullName;
        document.getElementById("myNameInline").textContent = fullName;
        
        if (profile?.role === "admin") {
          document.getElementById("adminLink").style.display = "inline-block";
        }

        const refCode = profile?.referral_code || userId.substring(0, 8);
        const base = window.location.href.replace("dashboard.html", "");
        document.getElementById("refLinkInput").value = base + "index.html?ref=" + refCode;

        // Wallet
        const { data: txns } = await supabaseClient.from("wallet_transactions").select("amount").eq("investor_id", userId);
        const totalWallet = (txns || []).reduce((sum, t) => sum + Number(t.amount || 0), 0);
        document.getElementById("walletBalance").textContent = pkr(totalWallet);

        // Campaigns
        const { data: campaigns } = await supabaseClient.from("campaigns").select("*");
        const sel = document.getElementById("campaignSelect");
        if (campaigns && campaigns.length) {
          sel.innerHTML = campaigns.map(c => `<option value="${c.id}">${c.name} — Target ${pkr(c.target)}</option>`).join("");
        } else {
          sel.innerHTML = `<option value="">No campaigns found</option>`;
        }

        // Referred Users
        const { data: joined } = await supabaseClient.from("profiles").select("full_name, created_at").eq("referred_by", userId);
        const listEl = document.getElementById("referredUsersList");
        if (joined && joined.length) {
          listEl.innerHTML = joined.map((u, i) => `
            <div class="card" style="padding:8px 10px;display:flex;justify-content:space-between;font-size:12px;">
              <span><strong>#${i + 1}</strong> ${u.full_name || "Investor"}</span>
              <span class="muted">${u.created_at ? new Date(u.created_at).toLocaleDateString() : ""}</span>
            </div>
          `).join("");
        } else {
          listEl.innerHTML = `<p class="muted" style="font-size:12px;text-align:center;">Abhi tak koi join nahi hua.</p>`;
        }

        // Investments
        const { data: myInv } = await supabaseClient.from("investments").select("*, campaigns(*)").eq("investor_id", userId);
        const invList = document.getElementById("investmentsList");
        if (myInv && myInv.length) {
          invList.innerHTML = myInv.map(inv => `
            <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-weight:700;font-size:14px;">${inv.campaigns?.name || "Bike Campaign"}</div>
                <div class="muted" style="margin-top:2px;">Amount: ${pkr(inv.amount)}</div>
                <div class="mono" style="color:var(--success);margin-top:4px;font-size:12.5px;">Status: ${inv.status || "approved"}</div>
              </div>
            </div>
          `).join("");
        } else {
          invList.innerHTML = `<p class="muted" style="text-align:center;padding:20px;">No investments found.</p>`;
        }

      } catch (err) {
        console.error("Dashboard error:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", loadDashboardDirectly);
  </script>
</body>
</html>
