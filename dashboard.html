<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RozgarBike — Dashboard</title>

<link rel="stylesheet" href="assets/style.css">
<!-- Supabase JS Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#111827;
  color:#f3f4f6;
  margin:0;
  padding-bottom:50px
}
.navbar{
  background:#0b3c36;
  color:#fff;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #e29d38
}
.logo-area{ font-weight:bold; font-size:20px; display:flex; align-items:center; gap:8px }
.logo-box{ background:#e29d38; padding:4px 8px; border-radius:6px; color:#000 }
.btn-dash{ background:#e29d38; color:#000; padding:6px 14px; border-radius:20px; font-size:12px; font-weight:bold; text-decoration:none }

.container{ max-width:850px; margin:auto; padding:15px }

.card{
  background:#1f2937;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
  border:1px solid #374151;
  box-shadow:0 4px 6px -1px rgba(0,0,0,.3)
}
.card-title{
  font-size:16px;
  font-weight:bold;
  color:#e29d38;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px
}

.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}
.btn-action{
  padding:14px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition: opacity 0.2s;
}
.btn-deposit{ background:#10b981; color:#fff; }
.btn-withdraw{ background:#e29d38; color:#000; }
.btn-copy{ background:#3b82f6; color:#fff; padding:8px 14px; border:0; border-radius:6px; cursor:pointer; font-weight:bold }

/* MODAL STYLES */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.75);
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal.active{ display:flex; }
.modal-content{
  background:#1f2937;
  border-radius:12px;
  width:100%;
  max-width:450px;
  padding:20px;
  border:1px solid #374151;
  position:relative;
}
.modal-close{
  position:absolute;
  top:12px; right:15px;
  font-size:20px;
  cursor:pointer;
  color:#9ca3af;
}

.input-box, select{
  width:100%;
  padding:10px;
  background:#374151;
  border:1px solid #4b5563;
  color:#fff;
  border-radius:6px;
  margin-bottom:12px;
  font-size:14px;
  outline:none
}

.file-input{
  width:100%;
  padding:8px;
  background:#374151;
  border:1px dashed #e29d38;
  color:#fff;
  border-radius:6px;
  margin-bottom:12px;
  font-size:13px;
  cursor:pointer;
}

.table-responsive{ overflow-x:auto }
table{ width:100%; border-collapse:collapse; font-size:13px; text-align:left }
th, td{ padding:10px; border-bottom:1px solid #374151; vertical-align:middle }
th{ background:#111827; color:#9ca3af }
</style>
</head>

<body>

<div class="navbar">
  <div class="logo-area">
    <div class="logo-box">🚲</div>
    <span>RozgarBike</span>
  </div>
  <a href="admin.html" class="btn-dash">⚙️ Admin Panel</a>
</div>

<div class="container">

  <!-- BALANCE CARDS -->
  <div class="card">
    <div class="card-title">💰 Balance Overview</div>
    <div style="font-size:24px; font-weight:bold; color:#10b981;" id="userBalance">Rs 0</div>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="action-grid">
    <button onclick="openDepositModal()" class="btn-action btn-deposit">📥 Deposit Funds</button>
    <button onclick="openWithdrawModal()" class="btn-action btn-withdraw">📤 Withdraw Funds</button>
  </div>

  <!-- REFERRAL SYSTEM CARD -->
  <div class="card">
    <div class="card-title">👥 Refer & Earn (ریفرل سسٹم)</div>
    <p style="font-size:13px;color:#9ca3af;margin-top:0;">اپنا ریفرل لنک کاپی کریں اور دوستوں کے ساتھ شیئر کر کے بونس کمائیں۔</p>
    
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input id="refLinkInput" class="input-box" style="margin-bottom:0;" readonly value="Loading referral link...">
      <button onclick="copyReferralLink()" class="btn-copy">Copy Link</button>
    </div>
    <small style="color:#10b981;" id="copySuccessMsg"></small>
  </div>

  <!-- RECENT TRANSACTIONS -->
  <div class="card">
    <div class="card-title">📊 Recent Transactions</div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="txHistoryBody">
          <tr><td colspan="4">Loading transactions...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- DEPOSIT MODAL -->
<div id="depositModal" class="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeDepositModal()">&times;</span>
    <h3 style="color:#e29d38;margin-top:0;">📥 Deposit Funds</h3>
    
    <label style="font-size:12px;color:#9ca3af">Deposit Amount (PKR):</label>
    <input id="depAmount" type="number" class="input-box" placeholder="e.g. 1000">

    <label style="font-size:12px;color:#9ca3af">Transaction ID (Trx ID):</label>
    <input id="depTrx" class="input-box" placeholder="e.g. 8234910293">

    <label style="font-size:12px;color:#9ca3af">Upload Payment Receipt / Slip Image (Choose File):</label>
    <input id="depFile" type="file" accept="image/*" class="file-input">

    <button onclick="submitDeposit()" class="btn-action btn-deposit" style="width:100%;margin-top:10px;">Submit Deposit</button>
  </div>
</div>

<!-- WITHDRAW MODAL -->
<div id="withdrawModal" class="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeWithdrawModal()">&times;</span>
    <h3 style="color:#e29d38;margin-top:0;">📤 Request Withdrawal</h3>

    <label style="font-size:12px;color:#9ca3af">Payment Method:</label>
    <select id="witMethod" class="input-box">
      <option value="JazzCash">JazzCash</option>
      <option value="EasyPaisa">EasyPaisa</option>
      <option value="Bank Transfer">Bank Transfer</option>
    </select>
    
    <label style="font-size:12px;color:#9ca3af">Withdraw Amount (PKR):</label>
    <input id="witAmount" type="number" class="input-box" placeholder="e.g. 500">

    <label style="font-size:12px;color:#9ca3af">Account Title (Name):</label>
    <input id="witTitle" class="input-box" placeholder="e.g. Ali Raza">

    <label style="font-size:12px;color:#9ca3af">Account Number:</label>
    <input id="witNum" class="input-box" placeholder="e.g. 03001234567">

    <button onclick="submitWithdraw()" class="btn-action btn-withdraw" style="width:100%;margin-top:10px;">Submit Withdrawal</button>
  </div>
</div>

<script src="assets/config.js"></script>

<script>
function getSupabase() {
  return window.supabaseClient || window.supabase;
}

let currentUserId = null;

async function initDashboard() {
  const db = getSupabase();
  if(!db) {
    alert("Supabase initialize nahi hua.");
    return;
  }

  const { data: { session } } = await db.auth.getSession();
  if(session && session.user) {
    currentUserId = session.user.id;
  } else {
    currentUserId = localStorage.getItem("user_id") || "demo-user-id";
  }

  // Generate Referral Link
  const currentOrigin = window.location.origin + window.location.pathname.replace("dashboard.html", "");
  const refLink = `${currentOrigin}signup.html?ref=${currentUserId}`;
  document.getElementById("refLinkInput").value = refLink;

  loadUserData();
}

// COPY REFERRAL LINK
function copyReferralLink() {
  const refInput = document.getElementById("refLinkInput");
  refInput.select();
  refInput.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(refInput.value);
  
  const msg = document.getElementById("copySuccessMsg");
  msg.innerText = "✓ ریفرل لنک کاپی ہو گیا ہے!";
  setTimeout(() => { msg.innerText = ""; }, 3000);
}

// MODAL CONTROLS
function openDepositModal() {
  document.getElementById("depositModal").classList.add("active");
}
function closeDepositModal() {
  document.getElementById("depositModal").classList.remove("active");
}

function openWithdrawModal() {
  document.getElementById("withdrawModal").classList.add("active");
}
function closeWithdrawModal() {
  document.getElementById("withdrawModal").classList.remove("active");
}

// SUBMIT DEPOSIT (WITH FILE UPLOAD TO SUPABASE STORAGE)
async function submitDeposit() {
  const db = getSupabase();
  const amount = document.getElementById("depAmount").value;
  const trx_id = document.getElementById("depTrx").value;
  const fileInput = document.getElementById("depFile");

  if(!amount || Number(amount) <= 0) return alert("برائے مہربانی درست رقم درج کریں۔");
  if(!trx_id) return alert("برائے مہربانی Trx ID درج کریں۔");

  let uploadedSlipUrl = null;

  // Image Upload Logic to Supabase Storage
  if (fileInput.files.length > 0) {
    const file = fileInput.files[0];
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
    const filePath = `slips/${fileName}`;

    const { data: uploadData, error: uploadError } = await db.storage
      .from('deposit_slips')
      .upload(filePath, file);

    if (uploadError) {
      alert("تصویر اپلوڈ کرنے میں مسئلہ آیا: " + uploadError.message);
      return;
    }

    const { data: urlData } = db.storage.from('deposit_slips').getPublicUrl(filePath);
    uploadedSlipUrl = urlData.publicUrl;
  }

  const payload = {
    investor_id: currentUserId,
    amount: Number(amount),
    trx_id: trx_id,
    slip_url: uploadedSlipUrl,
    status: "pending"
  };

  const { error } = await db.from("investments").insert([payload]);

  if(error) {
    alert("ڈیپازٹ میں مسئلہ آیا: " + error.message);
  } else {
    alert("ڈیپازٹ کی درخواست کامیابی سے بھیج دی گئی ہے!");
    closeDepositModal();
    document.getElementById("depAmount").value = "";
    document.getElementById("depTrx").value = "";
    document.getElementById("depFile").value = "";
    loadUserData();
  }
}

// SUBMIT WITHDRAW
async function submitWithdraw() {
  const db = getSupabase();
  const payment_method = document.getElementById("witMethod").value;
  const amount = document.getElementById("witAmount").value;
  const account_title = document.getElementById("witTitle").value;
  const account_number = document.getElementById("witNum").value;

  if(!amount || Number(amount) <= 0) return alert("برائے مہربانی درست رقم درج کریں۔");
  if(!account_title || !account_number) return alert("اکاؤنٹ کی تفصیلات مکمل پر کریں۔");

  const payload = {
    investor_id: currentUserId,
    amount: Number(amount),
    payment_method: payment_method,
    account_title: account_title,
    account_number: account_number,
    status: "pending"
  };

  const { error } = await db.from("withdrawals").insert([payload]);

  if(error) {
    alert("ودڈرال درخواست میں مسئلہ آیا: " + error.message);
  } else {
    alert("ودڈرال درخواست بھیج دی گئی ہے!");
    closeWithdrawModal();
    document.getElementById("witAmount").value = "";
    document.getElementById("witTitle").value = "";
    document.getElementById("witNum").value = "";
    loadUserData();
  }
}

// LOAD TRANSACTIONS
async function loadUserData() {
  const db = getSupabase();
  const tbody = document.getElementById("txHistoryBody");

  const { data: invs } = await db.from("investments").select("*").eq("investor_id", currentUserId);
  const { data: wits } = await db.from("withdrawals").select("*").eq("investor_id", currentUserId);

  let allTx = [];
  if(invs) invs.forEach(i => allTx.push({ type: 'Deposit', amount: i.amount, status: i.status, date: i.created_at }));
  if(wits) wits.forEach(w => allTx.push({ type: 'Withdraw', amount: w.amount, status: w.status, date: w.created_at }));

  if(allTx.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#9ca3af">کوئی ٹرانزیکشن موجود نہیں ہے۔</td></tr>`;
    return;
  }

  tbody.innerHTML = allTx.map(t => `
    <tr>
      <td><b>${t.type}</b></td>
      <td>Rs ${Number(t.amount).toLocaleString()}</td>
      <td><span style="color:${t.status === 'approved' ? '#10b981' : '#f59e0b'}">${t.status}</span></td>
      <td>${new Date(t.date).toLocaleDateString()}</td>
    </tr>
  `).join("");
}

window.addEventListener("DOMContentLoaded", initDashboard);
</script>
</body>
</html>
