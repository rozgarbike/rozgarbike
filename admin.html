<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — RozgarBike</title>

<!-- Google Fonts & Styles -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --petrol: #0f3932;
    --petrol-light: #164e43;
    --ink: #1e293b;
    --ink-soft: #64748b;
    --line: #e2e8f0;
    --bg: #f1f5f9;
    --mustard: #f59e0b;
    --mustard-deep: #d97706;
    --rust: #dc2626;
    --success: #16a34a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--ink);
  }

  .header {
    background: var(--petrol);
    color: #ffffff;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
  }

  .brand {
    font-weight: 700;
    font-size: 18px;
  }

  .brand-badge {
    margin-right: 4px;
  }

  .nav {
    display: flex;
    gap: 16px;
    padding: 10px 16px;
    background: var(--petrol-light);
    font-size: 14px;
  }

  .nav a {
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 500;
  }

  .nav a.active {
    color: #ffffff;
    font-weight: 700;
  }

  .wrap {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .disp {
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .muted {
    color: var(--ink-soft);
    font-size: 13px;
  }

  .mono {
    font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  .card {
    background: #ffffff;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .btn {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    box-sizing: border-box;
    text-align: center;
    display: inline-block;
  }

  .btn-primary {
    background: var(--petrol);
    color: #ffffff;
  }

  .btn-dark {
    background: var(--ink);
    color: #ffffff;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--petrol);
    color: var(--petrol);
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0f172a;
    color: #ffffff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    z-index: 9999;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="brand"><span class="brand-badge">🚲</span> RozgarBike Panel</div>
      <button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,0.4);padding:6px 12px;font-size:12px;cursor:pointer;" onclick="logout()">Log out</button>
    </div>
    <div class="nav">
      <a href="index.html">Bikes</a>
      <a href="dashboard.html">My Dashboard</a>
      <a href="admin.html" class="active">Admin</a>
    </div>
  </div>

  <div class="wrap">

    <div class="disp" style="font-size:16px;margin-bottom:8px;">WHATSAPP LINKS & SUPPORT</div>
    <div class="card" style="margin-bottom:24px;">
      <div class="muted" style="margin-bottom:6px;">WhatsApp Number (Chat link) — e.g. 923245380453</div>
      <input id="waNumber" placeholder="923245380453" style="margin-bottom:12px;" />
      <div class="muted" style="margin-bottom:6px;">WhatsApp Channel Link (Follow)</div>
      <input id="waChannel" placeholder="https://whatsapp.com/channel/xxxx" style="margin-bottom:12px;" />
      <button class="btn btn-dark" style="width:100%;" onclick="saveWhatsApp()">Save WhatsApp Links</button>
    </div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">PENDING PAYMENTS</div>
    <div id="pendingList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;"></div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">WITHDRAWAL REQUESTS</div>
    <div id="withdrawList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;"></div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">REFERRAL TEAMS</div>
    <div id="referralsList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;"></div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">PAYMENT METHODS</div>
    <div id="methodsList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;"></div>
    <div class="card" style="margin-bottom:24px;">
      <div class="muted" style="margin-bottom:8px;font-weight:700;">Add A New Payment Account</div>
      <input id="newLabel" placeholder="Label, e.g. JazzCash / Easypaisa / Meezan Bank" style="margin-bottom:8px;" />
      <input id="newTitle" placeholder="Account Title / Name" style="margin-bottom:8px;" />
      <input id="newNumber" placeholder="Account / Phone Number" style="margin-bottom:10px;" />
      <button class="btn btn-dark" style="width:100%;" onclick="addMethod()">Add Account</button>
    </div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">CREATE A CAMPAIGN</div>
    <div class="card" style="margin-bottom:20px;">
      <input id="newName" placeholder="Bike name, e.g. Bike #14" style="margin-bottom:8px;" />
      <input id="newTarget" type="number" placeholder="Target amount (Rs)" style="margin-bottom:8px;" />
      <input id="newMargin" type="number" placeholder="Margin on top of target (Rs)" style="margin-bottom:10px;" />
      <button class="btn btn-dark" style="width:100%;" onclick="createCampaign()">Create Campaign</button>
    </div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">ACTIVE CAMPAIGNS</div>
    <div id="campaignsList" style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px;"></div>

    <div class="disp" style="font-size:16px;margin-bottom:8px;">CLOSED CAMPAIGNS</div>
    <div id="closedList" style="display:flex;flex-direction:column;gap:12px;"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // DIRECT INJECTED CREDENTIALS
    const SUPABASE_URL = "https://iqwknfpmwekxdpmaykse.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Q4q2sgleePgGeoevraRKTw_UqNuvhV_";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let profile = null;

    function pkr(val) { return "PKR " + Number(val || 0).toLocaleString(); }
    function toast(msg) {
      const t = document.getElementById("toast");
      if (t) {
        t.textContent = msg;
        t.style.display = "block";
        setTimeout(() => { t.style.display = "none"; }, 3500);
      } else { alert(msg); }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      localStorage.clear();
      window.location.href = "index.html";
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "index.html";
        return;
      }

      const { data: prof } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).single();
      profile = prof;

      if (!profile || profile.role !== "admin") {
        toast("Admin access required");
        window.location.href = "dashboard.html";
        return;
      }

      await loadWhatsApp();
      await loadPending();
      await loadWithdrawals();
      await loadReferrals();
      await loadMethods();
      await loadCampaigns();
    }

    async function loadWhatsApp() {
      const { data, error } = await supabaseClient.from("site_settings").select("*");
      if (error) { toast("Could not load WhatsApp settings: " + error.message); return; }
      const map = {};
      (data || []).forEach(row => map[row.key] = row.value);
      document.getElementById("waNumber").value = map["whatsapp_number"] || "";
      document.getElementById("waChannel").value = map["whatsapp_channel"] || "";
    }

    async function saveWhatsApp() {
      const number = document.getElementById("waNumber").value.trim();
      const channel = document.getElementById("waChannel").value.trim();
      const { error: e1 } = await supabaseClient.from("site_settings").upsert({ key: "whatsapp_number", value: number });
      const { error: e2 } = await supabaseClient.from("site_settings").upsert({ key: "whatsapp_channel", value: channel });
      if (e1 || e2) return toast((e1 || e2).message);
      toast("WhatsApp links saved");
    }

    async function loadPending() {
      const listEl = document.getElementById("pendingList");
      const { data: pending, error } = await supabaseClient
        .from("investments").select("*, campaigns(name), profiles(full_name)")
        .eq("status", "pending").order("created_at", { ascending: true });
      if (error) { listEl.innerHTML = `<p class="muted">Could not load pending payments: ${error.message}</p>`; return; }
      if (!pending || !pending.length) {
        listEl.innerHTML = `<p class="muted">No pending payments right now.</p>`;
        return;
      }
      listEl.innerHTML = "";
      pending.forEach(p => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div style="font-weight:700;font-size:14px;">${pkr(p.amount)} — ${p.campaigns?.name || "Bike Investment"}</div>
          <div class="muted" style="margin-top:2px;">${p.profiles?.full_name || "Investor"}</div>
          <div class="muted" style="margin-top:6px;">Transaction ID: <span class="mono" style="color:var(--ink);">${p.transaction_id || "—"}</span></div>
          ${p.receipt_url ? `<a href="${p.receipt_url}" target="_blank"><img src="${p.receipt_url}" style="width:100%;max-width:220px;border-radius:10px;margin-top:8px;border:1px solid var(--line);" /></a>` : ""}
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-primary" style="flex:1;" onclick="approve('${p.id}')">Approve</button>
            <button class="btn btn-outline" style="flex:1;border-color:var(--rust);color:var(--rust);" onclick="decline('${p.id}')">Decline</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    async function approve(investmentId) {
      const { error } = await supabaseClient.rpc("approve_investment", { p_investment_id: investmentId });
      if (error) return toast(error.message);
      toast("Payment approved");
      await loadPending();
      await loadCampaigns();
    }

    async function decline(investmentId) {
      const { error } = await supabaseClient.rpc("decline_investment", { p_investment_id: investmentId });
      if (error) return toast(error.message);
      toast("Payment declined");
      await loadPending();
    }

    async function loadWithdrawals() {
      const listEl = document.getElementById("withdrawList");
      const { data: reqs, error } = await supabaseClient
        .from("withdrawal_requests").select("*, profiles(full_name)")
        .eq("status", "pending").order("created_at", { ascending: true });
      if (error) { listEl.innerHTML = `<p class="muted">Could not load withdrawal requests: ${error.message}</p>`; return; }
      if (!reqs || !reqs.length) {
        listEl.innerHTML = `<p class="muted">No withdrawal requests right now.</p>`;
        return;
      }
      listEl.innerHTML = "";
      reqs.forEach(r => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div style="font-weight:700;font-size:14px;">${pkr(r.amount)}</div>
          <div class="muted" style="margin-top:2px;">${r.profiles?.full_name || "Investor"}</div>
          <div class="muted" style="margin-top:6px;">${r.method}: <span class="mono" style="color:var(--ink);">${r.account_number}</span></div>
          <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="markPaid('${r.id}')">Mark as paid</button>
        `;
        listEl.appendChild(div);
      });
    }

    async function markPaid(requestId) {
      const { error } = await supabaseClient.rpc("mark_withdrawal_paid", { p_request_id: requestId });
      if (error) return toast(error.message);
      toast("Marked as paid");
      await loadWithdrawals();
    }

    async function loadReferrals() {
      const listEl = document.getElementById("referralsList");
      try {
        const { data: refs, error } = await supabaseClient
          .from("referrals").select("*, referrer:referrer_id(id, full_name, milestones_paid), referred:referred_id(full_name)")
          .order("created_at", { ascending: true });
        if (error) throw error;
        if (!refs || !refs.length) {
          listEl.innerHTML = `<p class="muted">No referrals yet.</p>`;
          return;
        }
        const groups = {};
        refs.forEach(r => {
          const key = r.referrer_id;
          if (!groups[key]) groups[key] = { name: r.referrer?.full_name || "Unknown", milestonesPaid: r.referrer?.milestones_paid || 0, members: [] };
          groups[key].members.push({ name: r.referred?.full_name || "Unknown", paid: r.bonus_paid });
        });
        listEl.innerHTML = "";
        Object.entries(groups).forEach(([referrerId, g]) => {
          const confirmedCount = g.members.filter(m => m.paid).length;
          const withinCycle = confirmedCount - g.milestonesPaid * 10;
          const hitMilestone = withinCycle >= 10;
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="font-weight:700;font-size:14px;">${g.name}</div>
              <span style="background:${hitMilestone ? "var(--mustard)" : "var(--bg)"};color:${hitMilestone ? "#fff" : "var(--ink-soft)"};font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;">${hitMilestone ? "🎉 Ready" : `${withinCycle} / 10`}</span>
            </div>
            <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;">
              ${g.members.map(m => `<div class="muted" style="font-size:12px;">${m.name} ${m.paid ? "✓" : "(not invested yet)"}</div>`).join("")}
            </div>
            <div style="display:flex;gap:6px;margin-top:10px;">
              <input id="refbonus-${referrerId}" type="number" placeholder="Milestone bonus (Rs)" style="flex:1;padding:8px;font-size:12px;" />
              <button class="btn btn-dark" style="padding:0 12px;font-size:12px;" onclick="giveReferralBonus('${referrerId}')">Give</button>
            </div>
          `;
          listEl.appendChild(div);
        });
      } catch (err) {
        listEl.innerHTML = `<p class="muted">Could not load referrals: ${err.message}</p>`;
      }
    }

    async function giveReferralBonus(referrerId) {
      const input = document.getElementById(`refbonus-${referrerId}`);
      const amount = Number(input.value);
      if (!amount) return toast("Enter a bonus amount");
      const { error } = await supabaseClient.rpc("give_referral_milestone_bonus", {
        p_referrer_id: referrerId, p_amount: amount,
      });
      if (error) return toast(error.message);
      toast(pkr(amount) + " referral milestone bonus sent");
      input.value = "";
      await loadReferrals();
    }

    async function loadMethods() {
      const listEl = document.getElementById("methodsList");
      const { data: methods, error } = await supabaseClient.from("payment_methods").select("*").order("created_at", { ascending: true });
      if (error) { listEl.innerHTML = `<p class="muted">Could not load payment methods: ${error.message}</p>`; return; }
      listEl.innerHTML = "";
      (methods || []).forEach(m => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <input value="${m.label || ""}" id="label-${m.id}" style="margin-bottom:6px;" />
          <input value="${m.account_title || ""}" id="title-${m.id}" style="margin-bottom:6px;" />
          <input value="${m.account_number || ""}" id="number-${m.id}" style="margin-bottom:8px;" />
          <div style="display:flex;gap:8px;">
            <button class="btn btn-dark" style="flex:1;" onclick="updateMethod('${m.id}')">Save</button>
            <button class="btn btn-outline" style="flex:1;" onclick="toggleMethod('${m.id}', ${m.active})">${m.active ? "Disable" : "Enable"}</button>
            <button class="btn btn-outline" style="flex:1;border-color:var(--rust);color:var(--rust);" onclick="deleteMethod('${m.id}')">Delete</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    async function addMethod() {
      const label = document.getElementById("newLabel").value.trim();
      const account_title = document.getElementById("newTitle").value.trim();
      const account_number = document.getElementById("newNumber").value.trim();
      if (!label || !account_title || !account_number) return toast("Fill all fields");
      const { error } = await supabaseClient.from("payment_methods").insert({ label, account_title, account_number, active: true });
      if (error) return toast(error.message);
      toast("Account added");
      document.getElementById("newLabel").value = "";
      document.getElementById("newTitle").value = "";
      document.getElementById("newNumber").value = "";
      await loadMethods();
    }

    async function updateMethod(id) {
      const label = document.getElementById(`label-${id}`).value;
      const account_title = document.getElementById(`title-${id}`).value;
      const account_number = document.getElementById(`number-${id}`).value;
      const { error } = await supabaseClient.from("payment_methods").update({ label, account_title, account_number }).eq("id", id);
      if (error) return toast(error.message);
      toast("Saved");
      await loadMethods();
    }

    async function toggleMethod(id, currentlyActive) {
      const { error } = await supabaseClient.from("payment_methods").update({ active: !currentlyActive }).eq("id", id);
      if (error) return toast(error.message);
      await loadMethods();
    }

    async function deleteMethod(id) {
      const { error } = await supabaseClient.from("payment_methods").delete().eq("id", id);
      if (error) return toast(error.message);
      toast("Account removed");
      await loadMethods();
    }

    async function createCampaign() {
      const name = document.getElementById("newName").value.trim();
      const target = Number(document.getElementById("newTarget").value);
      const margin = Number(document.getElementById("newMargin").value || 0);
      if (!name || !target) return toast("Name and target are required");
      const { error } = await supabaseClient.from("campaigns").insert({ name, target, margin, daily_cap: 999999999 });
      if (error) return toast(error.message);
      toast("Campaign created");
      document.getElementById("newName").value = "";
      document.getElementById("newTarget").value = "";
      document.getElementById("newMargin").value = "";
      await loadCampaigns();
    }

    async function closeCampaign(campaignId) {
      const { error } = await supabaseClient.rpc("close_campaign", { p_campaign_id: campaignId });
      if (error) return toast(error.message);
      toast("Campaign closed");
      await loadCampaigns();
    }

    async function giveBonus(investorId, campaignId) {
      const input = document.getElementById(`bonus-${campaignId}-${investorId}`);
      const amount = Number(input.value);
      if (!amount) return toast("Enter a bonus amount");
      const { error } = awa
