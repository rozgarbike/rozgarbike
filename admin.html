<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel — RozgarBike</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .admin-card { background:#fff; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px; }
  .btn-approve { background:#2ecc71; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
  .btn-reject { background:#e74c3c; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>

  <div class="header">
    <div class="header-row">
      <div class="brand"><span class="brand-badge">⚙️</span> Admin Panel</div>
      <a href="dashboard.html" style="color:#fff; text-decoration:none; font-size:13px;">Back to Dashboard</a>
    </div>
  </div>

  <div class="wrap">
    
    <!-- ALL CAMPAIGNS & INVESTMENTS -->
    <div class="admin-card">
      <h3>🚲 All Campaigns & User Investments</h3>
      <div id="adminCampaignsList" style="font-size:13px;">Loading investments & campaigns...</div>
    </div>

    <!-- PENDING DEPOSITS & RECEIPT PICS -->
    <div class="admin-card">
      <h3>💳 Pending Deposit Requests</h3>
      <div id="adminDepositsList" style="font-size:13px;">Loading deposit requests...</div>
    </div>

    <!-- PENDING WITHDRAWALS -->
    <div class="admin-card">
      <h3>💸 Pending Withdrawal Requests</h3>
      <div id="adminWithdrawalsList" style="font-size:13px;">Loading withdrawal requests...</div>
    </div>

  </div>

  <script src="assets/config.js"></script>
  <script>
    async function initAdmin() {
      if (typeof supabaseClient === 'undefined') return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "index.html"; return; }

      // Check if user is admin
      const { data: profile } = await supabaseClient.from("profiles").select("role").eq("id", session.user.id).single();
      if (!profile || profile.role !== 'admin') {
        alert("Access Denied! Sirf Admin is page ko dekh sakta hai.");
        window.location.href = "dashboard.html";
        return;
      }

      await loadAdminCampaigns();
      await loadAdminDeposits();
      await loadAdminWithdrawals();
    }

    async function loadAdminCampaigns() {
      const { data: invs } = await supabaseClient.from("investments").select("*, profiles(email), campaigns(name)");
      const el = document.getElementById("adminCampaignsList");

      if (!invs || invs.length === 0) {
        el.innerHTML = "<p>Puraney Rule: <b>Full Bike Campaign Joined (Active)</b> — Default Total Withdraw Received: <b>Rs 500</b></p>";
      } else {
        el.innerHTML = invs.map(i => `
          <div style="padding:10px 0; border-bottom:1px solid #eee;">
            <b>User:</b> ${i.profiles ? i.profiles.email : i.user_id}<br>
            <b>Campaign:</b> ${i.campaigns ? i.campaigns.name : 'Bike Fund'}<br>
            <b>Investment Amount:</b> Rs ${Number(i.amount).toLocaleString()}<br>
            <b>Withdrawal / Profit Paid:</b> Rs ${Number(i.profit_earned || 500).toLocaleString()}<br>
            <b>Status:</b> <span style="color:green; font-weight:bold;">${i.status || 'ACTIVE'}</span>
          </div>
        `).join("");
      }
    }

    async function loadAdminDeposits() {
      const { data: deps } = await supabaseClient.from("deposits").select("*, profiles(email)").eq("status", "pending");
      const el = document.getElementById("adminDepositsList");

      if (!deps || deps.length === 0) {
        el.innerHTML = "Koi pending deposit nahi hai.";
      } else {
        el.innerHTML = deps.map(d => `
          <div style="padding:10px 0; border-bottom:1px solid #eee;">
            <b>User:</b> ${d.profiles ? d.profiles.email : d.user_id}<br>
            <b>Method:</b> ${d.method} | <b>Amount:</b> Rs ${Number(d.amount).toLocaleString()}<br>
            <b>Transaction ID (TID):</b> <code style="background:#f1f1f1; padding:2px 5px;">${d.trx_id}</code><br>
            ${d.proof_img ? `<b>Receipt Pic:</b> <a href="${d.proof_img}" target="_blank" style="color:blue;">View Picture 🖼️</a><br>` : ''}
            <div style="margin-top:8px;">
              <button class="btn-approve" onclick="updateDepositStatus('${d.id}', 'approved')">Approve</button>
              <button class="btn-reject" onclick="updateDepositStatus('${d.id}', 'rejected')">Reject</button>
            </div>
          </div>
        `).join("");
      }
    }

    async function loadAdminWithdrawals() {
      const { data: w) } = await supabaseClient.from("withdrawals").select("*, profiles(email)").eq("status", "pending");
      const el = document.getElementById("adminWithdrawalsList");

      if (!w || w.length === 0) {
        el.innerHTML = "Koi pending withdrawal nahi hai.";
      } else {
        el.innerHTML = w.map(x => `
          <div style="padding:10px 0; border-bottom:1px solid #eee;">
            <b>User:</b> ${x.profiles ? x.profiles.email : x.user_id}<br>
            <b>Amount:</b> Rs ${Number(x.amount).toLocaleString()}<br>
            <b>Account Info:</b> ${x.account}<br>
            <div style="margin-top:8px;">
              <button class="btn-approve" onclick="updateWithdrawStatus('${x.id}', 'approved')">Mark Paid</button>
              <button class="btn-reject" onclick="updateWithdrawStatus('${x.id}', 'rejected')">Reject</button>
            </div>
          </div>
        `).join("");
      }
    }

    async function updateDepositStatus(id, status) {
      await supabaseClient.from("deposits").update({ status: status }).eq("id", id);
      alert("Deposit Status Updated: " + status);
      await loadAdminDeposits();
    }

    async function updateWithdrawStatus(id, status) {
      await supabaseClient.from("withdrawals").update({ status: status }).eq("id", id);
      alert("Withdrawal Status Updated: " + status);
      await loadAdminWithdrawals();
    }

    initAdmin();
  </script>
</body>
</html>
