<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Dashboard — RozgarBike</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="header">
    <div class="header-row">
      <div class="brand"><span class="brand-badge">🚲</span> RozgarBike (Admin)</div>
      <button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,0.4);padding:6px 12px;font-size:12px;cursor:pointer;" onclick="logout()">Log out</button>
    </div>
    <div class="nav">
      <a href="index.html">Bikes</a>
      <a href="dashboard.html">My Dashboard</a>
      <a href="admin.html" class="active">Admin</a>
    </div>
  </div>

  <div class="wrap">
    <div class="disp" style="font-size:18px;margin-bottom:12px;">PENDING INVESTMENTS</div>
    <div id="pendingInvestmentsList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
      <p class="muted" style="text-align:center;padding:15px;">Loading pending investments...</p>
    </div>

    <div class="disp" style="font-size:18px;margin-bottom:12px;">PENDING WITHDRAWALS</div>
    <div id="pendingWithdrawalsList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
      <p class="muted" style="text-align:center;padding:15px;">Loading pending withdrawals...</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(initAdmin, 300);
    });

    async function initAdmin() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = "index.html";
          return;
        }

        loadPendingInvestments();
        loadPendingWithdrawals();
      } catch (e) {
        console.error("Admin init error:", e);
      }
    }

    async function loadPendingInvestments() {
      const container = document.getElementById("pendingInvestmentsList");
      if (!container) return;

      try {
        const { data: invs, error } = await supabaseClient
          .from("investments")
          .select("*")
          .eq("status", "pending")
          .order("created_at", { ascending: false });

        if (error || !invs || invs.length === 0) {
          container.innerHTML = `<p class="muted" style="text-align:center;padding:15px;">No pending investments.</p>`;
          return;
        }

        container.innerHTML = "";
        invs.forEach(inv => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <div style="font-weight:700;font-size:14px;margin-bottom:4px;">Investment: Rs ${Number(inv.amount || 0).toLocaleString()}</div>
            <div class="muted" style="font-size:12px;margin-bottom:4px;">Transaction ID: <b>${inv.transaction_id || 'N/A'}</b></div>
            <div class="muted" style="font-size:12px;margin-bottom:8px;">Investor ID: ${inv.investor_id}</div>
            ${inv.receipt_url ? `<a href="${inv.receipt_url}" target="_blank" style="display:inline-block;font-size:12px;color:var(--petrol);margin-bottom:10px;font-weight:600;">View Receipt Screenshot ↗</a>` : ''}
            <div style="display:flex;gap:8px;margin-top:6px;">
              <button class="btn btn-primary" style="flex:1;padding:6px;font-size:12px;" onclick="approveInv('${inv.id}')">Approve</button>
              <button class="btn btn-outline" style="flex:1;padding:6px;font-size:12px;color:#b91c1c;border-color:#fca5a5;" onclick="declineInv('${inv.id}')">Decline</button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        container.innerHTML = `<p class="muted" style="text-align:center;padding:15px;">No pending investments.</p>`;
      }
    }

    async function approveInv(id) {
      const { error } = await supabaseClient.from("investments").update({ status: "active" }).eq("id", id);
      if (error) return toast("Error: " + error.message);
      toast("Investment approved!");
      loadPendingInvestments();
    }

    async function declineInv(id) {
      const { error } = await supabaseClient.from("investments").update({ status: "declined" }).eq("id", id);
      if (error) return toast("Error: " + error.message);
      toast("Investment declined!");
      loadPendingInvestments();
    }

    async function loadPendingWithdrawals() {
      const container = document.getElementById("pendingWithdrawalsList");
      if (!container) return;

      try {
        const { data: wds, error } = await supabaseClient
          .from("withdrawal_requests")
          .select("*")
          .eq("status", "pending")
          .order("created_at", { ascending: false });

        if (error || !wds || wds.length === 0) {
          container.innerHTML = `<p class="muted" style="text-align:center;padding:15px;">No pending withdrawals.</p>`;
          return;
        }

        container.innerHTML = "";
        wds.forEach(w => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <div style="font-weight:700;font-size:14px;margin-bottom:4px;">Amount: Rs ${Number(w.amount || 0).toLocaleString()}</div>
            <div class="muted" style="font-size:12px;margin-bottom:4px;">Method: <b>${w.method}</b> (${w.account_number})</div>
            <div class="muted" style="font-size:12px;margin-bottom:8px;">User ID: ${w.investor_id}</div>
            <div style="display:flex;gap:8px;margin-top:6px;">
              <button class="btn btn-primary" style="flex:1;padding:6px;font-size:12px;" onclick="approveWd('${w.id}')">Mark Paid</button>
              <button class="btn btn-outline" style="flex:1;padding:6px;font-size:12px;color:#b91c1c;border-color:#fca5a5;" onclick="declineWd('${w.id}')">Reject</button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        container.innerHTML = `<p class="muted" style="text-align:center;padding:15px;">No pending withdrawals.</p>`;
      }
    }

    async function approveWd(id) {
      const { error } = await supabaseClient.from("withdrawal_requests").update({ status: "paid" }).eq("id", id);
      if (error) return toast("Error: " + error.message);
      toast("Withdrawal marked as paid!");
      loadPendingWithdrawals();
    }

    async function declineWd(id) {
      const { error } = await supabaseClient.from("withdrawal_requests").update({ status: "rejected" }).eq("id", id);
      if (error) return toast("Error: " + error.message);
      toast("Withdrawal rejected!");
      loadPendingWithdrawals();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
