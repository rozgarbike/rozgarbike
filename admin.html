<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Dashboard — RozgarBike</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
  .admin-wrap { max-width: 600px; margin: 0 auto; padding: 16px; font-size: 14px; }
  .card-admin { background: #fff; padding: 16px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .title-section { font-weight: 700; font-size: 14px; color: #1e293b; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
  .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  .btn-submit { width: 100%; padding: 10px; background: #1e293b; color: #fff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .item-box { border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; background: #fff; display: flex; flex-direction: column; gap: 8px; }
  .item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 4px;}
  .item-body { font-size: 13px; color: #475569; line-height: 1.5; }
  .item-actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn-sm { padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; border: none; font-weight: 600; flex: 1; text-align: center;}
  .btn-approve { background: #16a34a; color: #fff; }
  .btn-reject { background: #ef4444; color: #fff; }
  .btn-delete { background: #fee2e2; color: #991b1b; padding: 4px 8px; font-size: 11px;}
  .slip-link { color: #2563eb; text-decoration: underline; font-weight: 600; cursor: pointer; }
  
  /* Modal Styles */
  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); padding-top: 60px; }
  .modal-content { margin: auto; display: block; max-width: 90%; max-height: 80%; border-radius: 8px;}
  .close { position: absolute; top: 15px; right: 25px; color: #f1f1f1; font-size: 35px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

  <!-- Image Modal -->
  <div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <div class="header">
    <div class="header-row" style="padding:12px 16px; background:#0f172a; color:#fff; display:flex; justify-content:space-between; align-items:center;">
      <div class="brand" style="font-weight:700;"><span class="brand-badge">🚲</span> RozgarBike Admin</div>
      <button onclick="handleLogout()" style="background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.4); padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px;">Log out</button>
    </div>
  </div>

  <div class="admin-wrap">

    <!-- EXISTING PAYMENT ACCOUNTS -->
    <div class="title-section">PAYMENT METHODS (ACCOUNTS)</div>
    <div class="card-admin">
      <div style="font-weight:700; font-size:13px; margin-bottom:8px;">Existing Payment Accounts:</div>
      <div id="paymentMethodsList">Loading accounts...</div>
    </div>

    <!-- PENDING DEPOSITS (MANUAL APPROVAL) -->
    <div class="title-section">PENDING DEPOSITS (SLIP REQUIRED)</div>
    <div class="card-admin">
      <div id="pendingDepositsList">Loading pending deposits...</div>
    </div>

    <!-- WITHDRAWAL REQUESTS -->
    <div class="title-section">PENDING WITHDRAWAL REQUESTS</div>
    <div class="card-admin">
      <!-- <button onclick="rejectAllPendingWithdrawals()" style="background:#dc2626; color:#fff; border:none; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer; width:100%; margin-bottom:12px;">Reject / Reset All Pending Withdrawals</button> -->
      <div id="withdrawalRequestsList">Loading withdrawal requests...</div>
    </div>

    <!-- ALL INVESTORS LIST -->
    <div class="title-section">ALL INVESTORS LIST</div>
    <div class="card-admin">
      <div style="font-weight:700; font-size:13px; margin-bottom:8px;">تمام انویسٹرز کی تفصیلات:</div>
      <div id="investorPayoutsList">Loading investor list...</div>
    </div>

  </div>

  <script src="assets/config.js"></script>
  <script>
    function pkr(val) { return "Rs " + Number(val || 0).toLocaleString("en-PK"); }
    
    // Modal Functions
    function openModal(imgUrl) {
      document.getElementById('modalImg').src = imgUrl;
      document.getElementById('imageModal').style.display = "block";
    }
    function closeModal() {
      document.getElementById('imageModal').style.display = "none";
    }

    async function handleLogout() {
      if (window.supabaseClient) await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    async function loadAdminData() {
      if (!window.supabaseClient) return;
      await loadPaymentMethods();
      await loadPendingDeposits();
      await loadWithdrawalRequests();
      await loadInvestorList();
    }

    // PAYMENT METHODS
    async function loadPaymentMethods() {
      const el = document.getElementById("paymentMethodsList");
      try {
        const { data, error } = await supabaseClient.from("payment_methods").select("*");
        if (error || !data || data.length === 0) {
          el.innerHTML = `<div style="color:#64748b; font-size:13px; padding:10px; border:1px dashed #cbd5e1; border-radius:6px; background:#f8fafc;">No payment accounts found.</div>`;
          return;
        }
        el.innerHTML = data.map(i => `
          <div class="item-box" style="flex-direction:row; justify-content:space-between; align-items:center;">
            <div><strong>${i.label}</strong> (${i.account_title})<br/>${i.account_number}</div>
            <button class="btn-sm btn-delete" style="flex:none;" onclick="deletePaymentMethod('${i.id}')">Delete</button>
          </div>
        `).join("");
      } catch(e) { el.innerHTML = `<div style="color:#64748b;">Error loading accounts.</div>`; }
    }

    async function deletePaymentMethod(id) {
      if(!confirm("Are you sure?")) return;
      await supabaseClient.from("payment_methods").delete().eq("id", id);
      loadPaymentMethods();
    }

    // DEPOSITS WITH SLIP
    async function loadPendingDeposits() {
      const el = document.getElementById("pendingDepositsList");
      try {
        // Joining with profiles table to get investor name
        const { data, error } = await supabaseClient
          .from("investments")
          .select("*, profiles(full_name)")
          .eq("status", "pending")
          .order("created_at", { ascending: false });
        
        if (error || !data || data.length === 0) {
          el.innerHTML = `<div style="color:#64748b; font-size:13px; padding:10px; border:1px dashed #cbd5e1; border-radius:6px; background:#f8fafc;">No pending deposits.</div>`;
          return;
        }

        el.innerHTML = data.map(i => {
          const investorName = i.profiles?.full_name || "Unknown Investor";
          const shortId = i.investor_id.substring(0, 6);
          const slipHtml = i.slip_url 
            ? `<span class="slip-link" onclick="openModal('${i.slip_url}')">View Payment Slip (رسید دیکھیں)</span>`
            : `<span style="color:#ef4444; font-weight:600;">No Slip Uploaded</span>`;

          return `
            <div class="item-box">
              <div class="item-header">
                <div>
                  <strong style="color:#0f172a; font-size:14px;">${investorName}</strong><br/>
                  <span style="color:#64748b; font-size:11px;">ID: ${shortId}</span>
                </div>
                <div style="text-align:right;">
                  <strong style="color:#16a34a; font-size:15px;">${pkr(i.amount)}</strong><br/>
                  <span style="color:#64748b; font-size:11px;">TRX: ${i.transaction_id || 'N/A'}</span>
                </div>
              </div>
              <div class="item-body">
                ${slipHtml}
              </div>
              <div class="item-actions">
                <button class="btn-sm btn-approve" onclick="approveDeposit('${i.id}', '${i.investor_id}', ${i.amount})">Approve (قبول کریں)</button>
                <button class="btn-sm btn-reject" onclick="rejectDeposit('${i.id}')">Reject (مسترد کریں)</button>
              </div>
            </div>
          `;
        }).join("");
      } catch(e) { el.innerHTML = `<div style="color:#64748b;">Error loading deposits.</div>`; }
    }

    async function approveDeposit(id, investorId, amount) {
      if(!confirm("Approve this deposit? Amount will be added to user wallet.")) return;
      await supabaseClient.from("investments").update({ status: "approved" }).eq("id", id);
      // Create wallet transaction to add balance
      await supabaseClient.from("wallet_transactions").insert([{ 
        investor_id: investorId, 
        amount: amount, 
        type: 'deposit', 
        status: 'approved' 
      }]);
      alert("Deposit approved!");
      loadPendingDeposits();
    }

    async function rejectDeposit(id) {
      if(!confirm("Reject this deposit?")) return;
      await supabaseClient.from("investments").update({ status: "rejected" }).eq("id", id);
      loadPendingDeposits();
    }

    // WITHDRAWALS INDIVIDUAL
    async function loadWithdrawalRequests() {
      const el = document.getElementById("withdrawalRequestsList");
      try {
        // Joining with profiles table
        const { data, error } = await supabaseClient
          .from("withdrawal_requests")
          .select("*, profiles(full_name)")
          .eq("status", "pending")
          .order("created_at", { ascending: false });

        if (error || !data || data.length === 0) {
          el.innerHTML = `<div style="color:#64748b; font-size:13px; padding:10px; border:1px dashed #cbd5e1; border-radius:6px; background:#f8fafc;">No pending withdrawal requests.</div>`;
          return;
        }

        el.innerHTML = data.map(w => {
          const investorName = w.profiles?.full_name || "Unknown Investor";
          const shortId = w.investor_id.substring(0, 6);

          return `
            <div class="item-box">
              <div class="item-header">
                <div>
                  <strong style="color:#0f172a; font-size:14px;">${investorName}</strong><br/>
                  <span style="color:#64748b; font-size:11px;">ID: ${shortId}</span>
                </div>
                <div style="text-align:right;">
                  <strong style="color:#dc2626; font-size:15px;">${pkr(w.amount)}</strong>
                </div>
              </div>
              <div class="item-body">
                <strong>Method:</strong> ${w.payment_method}<br/>
                <strong>Title:</strong> ${w.account_title}<br/>
                <strong>Account:</strong> <span style="font-family:monospace; background:#f1f5f9; padding:2px 4px; border-radius:4px;">${w.account_number}</span>
              </div>
              <div class="item-actions">
                <button class="btn-sm btn-approve" onclick="approveWithdrawal('${w.id}')">Mark Paid (پیسے بھیج دیے)</button>
                <button class="btn-sm btn-reject" onclick="rejectWithdrawal('${w.id}')">Reject (مسترد کریں)</button>
              </div>
            </div>
          `;
        }).join("");
      } catch(e) { el.innerHTML = `<div style="color:#64748b;">Error loading withdrawal requests.</div>`; }
    }

    async function approveWithdrawal(id) {
      if(!confirm("Mark this as paid? Make sure you have sent money via EasyPaisa/JazzCash.")) return;
      await supabaseClient.from("withdrawal_requests").update({ status: "approved" }).eq("id", id);
      alert("Withdrawal marked as paid!");
      loadWithdrawalRequests();
    }

    async function rejectWithdrawal(id) {
      if(!confirm("Reject this withdrawal request?")) return;
      await supabaseClient.from("withdrawal_requests").update({ status: "rejected" }).eq("id", id);
      loadWithdrawalRequests();
    }

    // ALL INVESTORS LIST
    async function loadInvestorList() {
      const el = document.getElementById("investorPayoutsList");
      try {
        const { data, error } = await supabaseClient.from("profiles").select("*").order("created_at", { ascending: false });
        if (error || !data || data.length === 0) {
          el.innerHTML = `<div style="color:#64748b;">No investor profiles found.</div>`;
          return;
        }
        el.innerHTML = data.map(p => `
          <div class="item-box" style="margin-bottom:6px; padding:10px; flex-direction:row; justify-content:space-between; align-items:center; background:#f8fafc; border:1px solid #f1f5f9;">
            <strong>${p.full_name || 'No Name'}</strong>
            <span style="color:#64748b; font-size:12px; font-family:monospace; background:#fff; padding:3px 6px; border-radius:4px; border:1px solid #e2e8f0;">ID: ${p.id.substring(0,6)}</span>
          </div>
        `).join("");
      } catch(e) { el.innerHTML = `<div style="color:#64748b;">Error loading investor list.</div>`; }
    }

    window.addEventListener("DOMContentLoaded", loadAdminData);
  </script>
</body>
</html>
