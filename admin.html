<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — RozgarBike</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="brand"><span class="brand-badge">🚲</span> RozgarBike Panel</div>
      <button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,0.4);padding:6px 12px;font-size:12px;cursor:pointer;" onclick="logout()">Log out</button>
    </div>
    <div class="nav">
      <a href="index.html">Bikes</a>
      <a href="dashboard.html">My Dashboard</a>
      <a href="admin.html" class="active">Admin</a>
    </div>
  </div>

  <div class="wrap">
    <!-- WHATSAPP LINKS -->
    <div class="disp" style="font-size:16px;margin-bottom:8px;">WHATSAPP LINKS & SUPPORT</div>
    <div class="card" style="margin-bottom:24px;">
      <div class="muted" style="margin-bottom:6px;">WhatsApp Number — e.g. 923245380453</div>
      <input id="waNumber" placeholder="923245380453" style="margin-bottom:12px;" />
      <div class="muted" style="margin-bottom:6px;">WhatsApp Channel Link</div>
      <input id="waChannel" placeholder="https://whatsapp.com/channel/xxxx" style="margin-bottom:12px;" />
      <button class="btn btn-dark" style="width:100%;" onclick="saveWhatsApp()">Save WhatsApp Links</button>
    </div>

    <!-- PENDING PAYMENTS WITH FULL DETAILS & DECLINE BUTTON -->
    <div class="disp" style="font-size:16px;margin-bottom:8px;">PENDING PAYMENTS</div>
    <div id="pendingList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">Loading...</div>

    <!-- WITHDRAWAL REQUESTS -->
    <div class="disp" style="font-size:16px;margin-bottom:8px;">WITHDRAWAL REQUESTS</div>
    <div id="withdrawList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">Loading...</div>

    <!-- PAYMENT METHODS -->
    <div class="disp" style="font-size:16px;margin-bottom:8px;">PAYMENT METHODS</div>
    <div id="methodsList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;">Loading...</div>
    <div class="card" style="margin-bottom:24px;">
      <div class="muted" style="margin-bottom:8px;font-weight:700;">Add A New Payment Account</div>
      <input id="newLabel" placeholder="Label, e.g. JazzCash / Easypaisa / Meezan Bank" style="margin-bottom:8px;" />
      <input id="newTitle" placeholder="Account Title / Name" style="margin-bottom:8px;" />
      <input id="newNumber" placeholder="Account / Phone Number" style="margin-bottom:10px;" />
      <button class="btn btn-dark" style="width:100%;" onclick="addMethod()">Add Account</button>
    </div>

    <!-- CREATE CAMPAIGN -->
    <div class="disp" style="font-size:16px;margin-bottom:8px;">CREATE CAMPAIGN</div>
    <div class="card" style="margin-bottom:20px;">
      <input id="newName" placeholder="Bike name (e.g. Bike #14)" style="margin-bottom:8px;" />
      <input id="newTarget" type="number" placeholder="Target amount (Rs)" style="margin-bottom:8px;" />
      <button class="btn btn-dark" style="width:100%;" onclick="createCampaign()">Create Campaign</button>
    </div>

    <!-- ACTIVE CAMPAIGNS -->
    <div class="disp" style="font-size:16px;margin-bottom:8px;">ACTIVE CAMPAIGNS (SHARE % PROFIT)</div>
    <div id="campaignsList" style="display:flex;flex-direction:column;gap:16px;margin-bottom:24px;">Loading...</div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    function pkr(val) { return "Rs " + Number(val || 0).toLocaleString(); }
    function toast(msg) { alert(msg); }

    function logout() {
      try {
        if (typeof supabaseClient !== 'undefined' && supabaseClient.auth) {
          supabaseClient.auth.signOut();
        }
      } catch(e){}
      localStorage.clear();
      window.location.href = "index.html";
    }

    async function init() {
      try {
        await loadWhatsApp();
        await loadPending();
        await loadWithdrawals();
        await loadMethods();
        await loadCampaigns();
      } catch(e) {
        console.error(e);
      }
    }

    async function loadWhatsApp() {
      try {
        const { data } = await supabaseClient.from("site_settings").select("*");
        const map = {};
        (data || []).forEach(row => map[row.key] = row.value);
        if (document.getElementById("waNumber")) document.getElementById("waNumber").value = map["whatsapp_number"] || "";
        if (document.getElementById("waChannel")) document.getElementById("waChannel").value = map["whatsapp_channel"] || "";
      } catch(e) {}
    }

    async function saveWhatsApp() {
      const number = document.getElementById("waNumber").value.trim();
      const channel = document.getElementById("waChannel").value.trim();
      await supabaseClient.from("site_settings").upsert({ key: "whatsapp_number", value: number });
      await supabaseClient.from("site_settings").upsert({ key: "whatsapp_channel", value: channel });
      toast("Saved!");
    }

    /* PENDING PAYMENTS (WITH RECEIPT & DECLINE OPTION) */
    async function loadPending() {
      const listEl = document.getElementById("pendingList");
      const { data } = await supabaseClient.from("investments").select("*").eq("status", "pending");
      if (!data || !data.length) return listEl.innerHTML = `<p class="muted">No pending payments.</p>`;
      
      listEl.innerHTML = data.map(p => {
        const proofLink = p.proof_url || p.receipt_url || p.screenshot || p.image;
        return `
          <div class="card" style="border-left:4px solid var(--gold);">
            <div style="font-weight:800;font-size:18px;color:#1e293b;margin-bottom:4px;">Amount: ${pkr(p.amount)}</div>
            <div style="font-size:13px;color:#475569;">Trx / Phone: <b>${p.transaction_id || p.sender_number || "N/A"}</b></div>
            ${p.user_email ? `<div style="font-size:12px;color:#64748b;">User: ${p.user_email}</div>` : ''}
            
            ${proofLink ? `
              <div style="margin-top:8px;">
                <a href="${proofLink}" target="_blank" class="btn btn-outline" style="display:inline-block;padding:4px 10px;font-size:12px;text-decoration:none;">🖼️ View Payment Receipt / Screenshot</a>
              </div>
            ` : ''}

            <div style="display:flex;gap:10px;margin-top:12px;">
              <button class="btn btn-primary" style="flex:1;background:#16a34a;border:none;color:white;padding:8px;cursor:pointer;border-radius:6px;font-weight:700;" onclick="approve('${p.id}')">Approve</button>
              <button class="btn btn-outline" style="flex:1;border-color:#dc2626;color:#dc2626;padding:8px;cursor:pointer;border-radius:6px;font-weight:700;" onclick="decline('${p.id}')">Decline</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function approve(id) {
      await supabaseClient.from("investments").update({ status: "approved" }).eq("id", id);
      toast("Payment Approved!");
      loadPending();
      loadCampaigns();
    }

    async function decline(id) {
      if(!confirm("Are you sure you want to decline this payment?")) return;
      await supabaseClient.from("investments").update({ status: "declined" }).eq("id", id);
      toast("Payment Declined!");
      loadPending();
    }

    async function loadWithdrawals() {
      const listEl = document.getElementById("withdrawList");
      const { data } = await supabaseClient.from("withdrawal_requests").select("*").eq("status", "pending");
      if (!data || !data.length) return listEl.innerHTML = `<p class="muted">No withdrawal requests.</p>`;
      listEl.innerHTML = data.map(r => `
        <div class="card">
          <div>${pkr(r.amount)} to ${r.account_number} (${r.method})</div>
          <button class="btn btn-primary" style="margin-top:8px;" onclick="markPaid('${r.id}')">Mark Paid</button>
        </div>
      `).join('');
    }

    async function markPaid(id) {
      await supabaseClient.from("withdrawal_requests").update({ status: "paid" }).eq("id", id);
      toast("Paid!");
      loadWithdrawals();
    }

    /* PAYMENT METHODS MANAGEMENT */
    async function loadMethods() {
      const listEl = document.getElementById("methodsList");
      try {
        const { data: methods } = await supabaseClient.from("payment_methods").select("*").order("created_at", { ascending: true });
        if (!methods || !methods.length) {
          listEl.innerHTML = `<p class="muted">No payment methods added yet.</p>`;
          return;
        }
        listEl.innerHTML = "";
        methods.forEach(m => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <input value="${m.label || ""}" id="label-${m.id}" placeholder="Method Label" style="margin-bottom:6px;" />
            <input value="${m.account_title || ""}" id="title-${m.id}" placeholder="Account Title" style="margin-bottom:6px;" />
            <input value="${m.account_number || ""}" id="number-${m.id}" placeholder="Account Number" style="margin-bottom:8px;" />
            <div style="display:flex;gap:8px;">
              <button class="btn btn-dark" style="flex:1;" onclick="updateMethod('${m.id}')">Save</button>
              <button class="btn btn-outline" style="flex:1;" onclick="toggleMethod('${m.id}', ${m.active})">${m.active ? "Disable" : "Enable"}</button>
              <button class="btn btn-outline" style="flex:1;border-color:var(--rust);color:var(--rust);" onclick="deleteMethod('${m.id}')">Delete</button>
            </div>
          `;
          listEl.appendChild(div);
        });
      } catch(e) {
        listEl.innerHTML = `<p class="muted">No payment methods found.</p>`;
      }
    }

    async function addMethod() {
      const label = document.getElementById("newLabel").value.trim();
      const account_title = document.getElementById("newTitle").value.trim();
      const account_number = document.getElementById("newNumber").value.trim();
      if (!label || !account_title || !account_number) return toast("Fill all fields");
      await supabaseClient.from("payment_methods").insert({ label, account_title, account_number, active: true });
      toast("Account added!");
      document.getElementById("newLabel").value = "";
      document.getElementById("newTitle").value = "";
      document.getElementById("newNumber").value = "";
      await loadMethods();
    }

    async function updateMethod(id) {
      const label = document.getElementById(`label-${id}`).value;
      const account_title = document.getElementById(`title-${id}`).value;
      const account_number = document.getElementById(`number-${id}`).value;
      await supabaseClient.from("payment_methods").update({ label, account_title, account_number }).eq("id", id);
      toast("Saved!");
      await loadMethods();
    }

    async function toggleMethod(id, currentlyActive) {
      await supabaseClient.from("payment_methods").update({ active: !currentlyActive }).eq("id", id);
      await loadMethods();
    }

    async function deleteMethod(id) {
      await supabaseClient.from("payment_methods").delete().eq("id", id);
      toast("Account removed!");
      await loadMethods();
    }

    async function createCampaign() {
      const name = document.getElementById("newName").value;
      const target = Number(document.getElementById("newTarget").value);
      if(!name || !target) return toast("Fill fields!");
      await supabaseClient.from("campaigns").insert({ name, target, status: "active" });
      toast("Campaign Created!");
      loadCampaigns();
    }

    async function loadCampaigns() {
      const listEl = document.getElementById("campaignsList");
      const { data: campaigns } = await supabaseClient.from("campaigns").select("*").eq("status", "active");

      if (!campaigns || !campaigns.length) return listEl.innerHTML = `<p class="muted">No active campaigns.</p>`;

      listEl.innerHTML = "";
      for (const c of campaigns) {
        const { data: investments } = await supabaseClient.from("investments").select("*").eq("campaign_id", c.id).eq("status", "approved");
        const totalPool = (investments || []).reduce((sum, i) => sum + Number(i.amount || 0), 0);

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div style="font-weight:800;font-size:16px;">${c.name}</div>
          <div class="muted">Total Raised: ${pkr(totalPool)} / Target: ${pkr(c.target)}</div>
          <div style="margin-top:10px;background:#f8fafc;padding:10px;border-radius:6px;">
            <input id="sim-${c.id}" type="number" placeholder="Enter Daily Rider Profit (e.g. 2800)" style="width:100%;margin-bottom:6px;" />
            <button class="btn btn-dark" style="width:100%;" onclick="distributeProportional('${c.id}')">Distribute Profit (Share %)</button>
          </div>
          <div style="margin-top:10px;" id="invs-${c.id}"></div>
        `;
        listEl.appendChild(div);

        const invContainer = div.querySelector(`#invs-${c.id}`);
        (investments || []).forEach(inv => {
          const share = totalPool > 0 ? ((inv.amount / totalPool) * 100).toFixed(1) : 0;
          invContainer.innerHTML += `<div style="font-size:12px;margin-top:4px;">Investor: ${pkr(inv.amount)} (${share}%) | Received: ${pkr(inv.received)}</div>`;
        });
      }
    }

    async function distributeProportional(campaignId) {
      const input = document.getElementById(`sim-${campaignId}`);
      const profitAmount = Number(input.value);
      if (!profitAmount) return toast("Enter profit amount!");

      const { data: investments } = await supabaseClient.from("investments").select("*").eq("campaign_id", campaignId).eq("status", "approved");
      const totalPool = (investments || []).reduce((sum, i) => sum + Number(i.amount || 0), 0);

      if (!totalPool) return toast("No investments in pool!");

      for (const inv of investments) {
        const shareRatio = inv.amount / totalPool;
        const profitShare = profitAmount * shareRatio;

        await supabaseClient.from("investments").update({
          received: Number(inv.received || 0) + profitShare
        }).eq("id", inv.id);
      }

      toast("Profit distributed!");
      input.value = "";
      loadCampaigns();
    }

    init();
  </script>
</body>
</html>
