<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel — RozgarBike</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .admin-card { background:#fff; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px; }
  .btn-approve { background:#2ecc71; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
  .btn-reject { background:#e74c3c; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>

  <div class="header">
    <div class="header-row">
      <div class="brand"><span class="brand-badge">⚙️</span> Admin Panel</div>
      <a href="dashboard.html" style="color:#fff; text-decoration:none; font-size:13px;">Back to Dashboard</a>
    </div>
  </div>

  <div class="wrap">
    
    <!-- ALL CAMPAIGNS & INVESTMENTS -->
    <div class="admin-card">
      <h3>🚲 User Investments & Campaigns</h3>
      <div id="adminCampaignsList" style="font-size:13px;">Loading investments...</div>
    </div>

    <!-- PENDING DEPOSITS -->
    <div class="admin-card">
      <h3>💳 Pending Deposit Requests</h3>
      <div id="adminDepositsList" style="font-size:13px;">Loading deposits...</div>
    </div>

    <!-- PENDING WITHDRAWALS -->
    <div class="admin-card">
      <h3>💸 Pending Withdrawal Requests</h3>
      <div id="adminWithdrawalsList" style="font-size:13px;">Loading withdrawals...</div>
    </div>

  </div>

  <script src="assets/config.js"></script>
  <script>
    async function initAdmin() {
      if (typeof supabaseClient === 'undefined') return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "index.html"; return; }

      const { data: profile } = await supabaseClient.from("profiles").select("role").eq("id", session.user.id).single();
      if (!profile || profile.role !== 'admin') {
        alert("Access Denied!");
        window.location.href = "dashboard.html";
        return;
      }

      await loadAdminCampaigns();
      await loadAdminDeposits();
      await loadAdminWithdrawals();
    }

    async function loadAdminCampaigns() {
      const { data: invs } = await supabaseClient.from("investments").select("*, profiles(email), campaigns(name)");
      const el = document.getElementById("adminCampaignsList");

      if (!invs || invs.length === 0) {
        el.innerHTML = "Koi investment record nahi hai.";
      } else {
        el.innerHTML = invs.map(i => `
          <div style="padding:10px 0; border-bottom:1px solid #eee;">
            <b>User:</b> ${i.profiles ? i.profiles.email : i.user_id}<br>
            <b>Campaign:</b> ${i.campaigns ? i.campaigns.name : 'Campaign'}<br>
            <b>Amount:</b> Rs ${Number(i.amount).toLocaleString()}<br>
            <b>Status:</b> <b>${i.status || 'PENDING'}</b>
          </div>
        `).join("");
      }
    }

    async function loadAdminDeposits() {
      const { data: deps } = await supabaseClient.from("deposits").select("*, profiles(email)").eq("status", "pending");
      const el = document.getElementById("adminDepositsList");

      if (!deps || deps.length === 0) {
        el.innerHTML = "Koi pending deposit nahi hai.";
      } else {
        el.innerHTML = deps.map(d => `
          <div style="padding:10px 0; border-bottom:1px solid #eee;">
            <b>User:</b> ${d.profiles ? d.profiles.email : d.user_id}<br>
            <b>Method:</b> ${d.method} | <b>Amount:</b> Rs ${Number(d.amount).toLocaleString()}<br>
            <b>TID:</b> <code>${d.trx_id}</code><br>
            <div style="margin-top:8px;">
              <button class="btn-approve" onclick="updateDepositStatus('${d.id}', '${d.user_id}', ${d.amount}, 'approved')">Approve</button>
              <button class="btn-reject" onclick="updateDepositStatus('${d.id}', '${d.user_id}', ${d.amount}, 'rejected')">Reject</button>
            </div>
          </div>
        `).join("");
      }
    }

    async function loadAdminWithdrawals() {
      const { data: w } = await supabaseClient.from("withdrawal_requests").select("*, profiles(email)").eq("status", "pending");
      const el = document.getElementById("adminWithdrawalsList");

      if (!w || w.length === 0) {
        el.innerHTML = "Koi pending withdrawal request nahi hai.";
      } else {
        el.innerHTML = w.map(x => `
          <div style="padding:10px 0; border-bottom:1px solid #eee;">
            <b>User:</b> ${x.profiles ? x.profiles.email : x.user_id}<br>
            <b>Bank:</b> ${x.bank_name || 'Bank'}<br>
            <b>Title:</b> ${x.account_name || 'N/A'} | <b>Account:</b> ${x.account_number || 'N/A'}<br>
            <b>Amount:</b> Rs ${Number(x.amount).toLocaleString()}<br>
            <div style="margin-top:8px;">
              <button class="btn-approve" onclick="updateWithdrawStatus('${x.id}', '${x.user_id}', ${x.amount}, 'approved')">Approve & Pay</button>
              <button class="btn-reject" onclick="updateWithdrawStatus('${x.id}', '${x.user_id}', ${x.amount}, 'rejected')">Reject</button>
            </div>
          </div>
        `).join("");
      }
    }

    async function updateDepositStatus(id, userId, amount, status) {
      await supabaseClient.from("deposits").update({ status: status }).eq("id", id);
      if (status === 'approved') {
        const { data: prof } = await supabaseClient.from("profiles").select("balance").eq("id", userId).single();
        const oldBal = prof ? (prof.balance || 0) : 0;
        await supabaseClient.from("profiles").update({ balance: oldBal + amount }).eq("id", userId);
      }
      alert("Status updated: " + status);
      await loadAdminDeposits();
    }

    async function updateWithdrawStatus(id, userId, amount, status) {
      await supabaseClient.from("withdrawal_requests").update({ status: status }).eq("id", id);
      if (status === 'approved') {
        const { data: prof } = await supabaseClient.from("profiles").select("balance").eq("id", userId).single();
        const oldBal = prof ? (prof.balance || 0) : 0;
        const newBal = Math.max(0, oldBal - amount);
        await supabaseClient.from("profiles").update({ balance: newBal }).eq("id", userId);
      }
      alert("Status updated: " + status);
      await loadAdminWithdrawals();
    }

    initAdmin();
  </script>
</body>
</html>
